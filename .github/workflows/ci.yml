name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release workflow runs these same checks before publishing.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - run: make check
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .'
      - name: Reject private local files
        run: python3 scripts/check_public_files.py
  # Release pipeline: build every archive without publishing and validate the contract.
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GORELEASER_VERSION: 2.18.3
      GORELEASER_SHA256: b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc
      DRY_RUN_VERSION: 0.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GoReleaser
        run: |
          archive=goreleaser_Linux_x86_64.tar.gz
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/$archive"
          printf '%s  %s\n' "$GORELEASER_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" goreleaser
          "$RUNNER_TEMP/goreleaser" --version | grep -Eq "^GitVersion:[[:space:]]+${GORELEASER_VERSION}$"
      - name: Build release archives without publishing
        env:
          GORELEASER_CURRENT_TAG: v${{ env.DRY_RUN_VERSION }}
        run: |
          "$RUNNER_TEMP/goreleaser" check
          # Exercise the real release path, including CHANGELOG.md, and prove
          # the requested stable tag wins over an RC on the same commit.
          # These tags exist only in this runner's disposable checkout.
          git tag "v${DRY_RUN_VERSION}-rc.1"
          git tag "v${DRY_RUN_VERSION}"
          "$RUNNER_TEMP/goreleaser" release --skip=publish --clean
      - name: Validate release contract
        run: python3 scripts/check_release_artifacts.py --dist dist --version "$DRY_RUN_VERSION" --native=linux/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 3
  release-smoke:
    name: Release smoke (${{ matrix.target }})
    needs: release-dry-run
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-latest
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      DRY_RUN_VERSION: 0.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/release
      - name: Validate archives and run the native binary
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          python3 scripts/check_release_artifacts.py --dist "$RUNNER_TEMP/release"
          --version "$DRY_RUN_VERSION" --native="$TARGET" --skip-buildinfo
